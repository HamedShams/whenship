name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --port 4545 --no-open &
          sleep 2
          curl -fsS http://127.0.0.1:4545/healthz
          curl -fsS http://127.0.0.1:4545/ | grep -q '"mode":"web"'
