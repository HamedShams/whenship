    <noscript>
      <h1>whenship: when will it ship, honestly?</h1>
      <p>A tiny planner for small teams: list the work, who does it and roughly how long it takes, and whenship draws the timeline, shows which deadlines will slip and why, and lets you try changes live. It needs JavaScript.</p>
      <ul>
        <li>Realistic dates: see the plan as planned, as likely (1.6×) or as a safe bet (3.1×), with each deadline's chance of being met.</li>
        <li>What-if: drag to reprioritise, change who does what or add a person, and every date updates at once.</li>
        <li>Suggestions: the changes that meet more deadlines, each checked by re-planning.</li>
        <li>Exports: Excel with a Gantt sheet, PNG, SVG, calendar (.ics), CSV, Markdown, or a share link with the plan inside.</li>
        <li>In Claude: add the connector (this address followed by <code>/mcp</code>) and ask Claude whether the deadlines will hold; the same live chart opens in the chat.</li>
        <li>Private: no accounts; plans stay in your browser. Free and open source (BSD 3-Clause); runs offline or with <code>npx whenship</code>.</li>
      </ul>
      <p>Made by <a href="https://hamedshams.com">Seyed Hamed Shams</a>. Source: <a href="https://github.com/HamedShams/whenship">github.com/HamedShams/whenship</a>.</p>
