<!doctype html>
<!-- The link-preview image (docs/og.png, served as /og.png). Regenerate after changing it:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=docs/og.png scripts/og.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f6f7fb; font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d2433; }
      .top { display: flex; align-items: center; gap: 22px; padding: 64px 72px 0; }
      h1 { margin: 0; font-size: 72px; letter-spacing: -0.03em; line-height: 1; }
      p { margin: 22px 72px 0; font-size: 34px; color: #4a5468; letter-spacing: -0.01em; }
      .chart { position: absolute; left: 48px; right: 48px; bottom: 0; height: 352px; overflow: hidden; border-radius: 18px 18px 0 0; background: #fff; box-shadow: 0 -2px 30px rgba(29, 36, 51, 0.12); }
      .chart img { display: block; width: 1220px; margin: 14px 0 0 -6px; }
      .url { position: absolute; right: 72px; top: 76px; font-size: 26px; color: #4f46e5; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="top">
      <svg width="76" height="76" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4c6ef5" />
        <rect x="6" y="8" width="13" height="4" rx="2" fill="#fff" />
        <rect x="11" y="14" width="15" height="4" rx="2" fill="#fff" opacity=".85" />
        <rect x="9" y="20" width="9" height="4" rx="2" fill="#fff" opacity=".7" />
        <path d="M24 20.5l2.5 2.5-2.5 2.5-2.5-2.5z" fill="#ffd43b" />
      </svg>
      <h1>whenship</h1>
    </div>
    <span class="url">whenship.app</span>
    <p>When will it ship, honestly? A live what-if Gantt for small teams.</p>
    <div class="chart"><img src="../docs/example.svg" alt="" /></div>
  </body>
</html>
