<!doctype html>
<!-- The link-preview image (docs/og.png, served as /og.png): the name, the promise, and the README's screenshot from the
     headline down. `npm run docs:pictures` takes both pictures. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0f1012; font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f1f3f6; }
      .top { display: flex; align-items: center; gap: 22px; padding: 56px 72px 0; }
      h1 { margin: 0; font-size: 72px; letter-spacing: -0.03em; line-height: 1; }
      p { margin: 20px 72px 0; font-size: 34px; color: #aab0bb; letter-spacing: -0.01em; }
      .chart { position: absolute; left: 48px; right: 48px; bottom: 0; height: 366px; overflow: hidden; border-radius: 18px 18px 0 0; border: 1px solid #33363d; border-bottom: 0; background: #17181b; box-shadow: 0 -2px 40px rgba(0, 0, 0, 0.5); }
      /* the screenshot is 1280 wide and starts with the toolbar: shown from the headline down */
      .chart img { display: block; width: 1104px; margin-top: -94px; }
      .url { position: absolute; right: 72px; top: 70px; font-size: 26px; color: #a5b4fc; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="top">
      <svg width="76" height="76" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4c6ef5" />
        <rect x="6" y="8" width="13" height="4" rx="2" fill="#fff" />
        <rect x="11" y="14" width="15" height="4" rx="2" fill="#fff" opacity=".85" />
        <rect x="9" y="20" width="9" height="4" rx="2" fill="#fff" opacity=".7" />
        <path d="M24 20.5l2.5 2.5-2.5 2.5-2.5-2.5z" fill="#ffd43b" />
      </svg>
      <h1>whenship</h1>
    </div>
    <span class="url">whenship.app</span>
    <p>When will it ship, honestly? A live what-if Gantt for small teams.</p>
    <div class="chart"><img src="../docs/screenshot.png" alt="" /></div>
  </body>
</html>
